# Fix Colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Scrolling
setw -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows
set-option -g renumber-windows on

# Statusline Colors
# set -g status-style bg='#232136',fg='#e0def4'
# set -g pane-border-style fg='#393552'
# set -g pane-active-border-style fg='#c4a7e7'

# Statusline location
set -g status-position bottom

# # Inactive windows
# set -g window-status-style bg='#232136',fg='#6e6a86'
#
# # Active window (reversed)
# set -g window-status-current-style bg='#2a273f',fg='#e0def4'

# Time settings
set -g status-right "%I:%M %p, %d-%b-%y, %a"

# Increase left length
set -g status-left-length 20

# Increase line history limit
set -g history-limit 5000

# Vi mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

set -g allow-passthrough on

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g extended-keys-format csi-u

# Split bindings
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

set -g @session_manager_key 's'  # Use 's' instead of 'j'
set -g @floax-bind 'o'
set -g @floax-menu-bind 'O'
unbind-key -n C-M-f
# set -g @floax-border-color '#c4a7e7'
# set -g @floax-text-color '#e0def4'

bind p previous-window

# Rose Pine Theme
set -g @rose_pine_date_time '%I:%M, %d %a' # It accepts the date UNIX command format (man date for info)
set -g @rose_pine_right_separator ' '
set -g @rose_pine_window_status_separator ' '
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'santoshxshrestha/tmux-session-manager'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'rose-pine/tmux'

set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
